services:
  postgres:
    image: postgres:17
    container_name: taskmanager_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    networks:
        - taskmanager_network

  backend:
    image: victorpolicarpo2006/taskmanager:1.1
    container_name: taskmanager_backend
    restart: always
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - DDL_AUTO=${DDL_AUTO}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - taskmanager_network

volumes:
  postgres_data:

networks:
    taskmanager_network:
      driver: bridge